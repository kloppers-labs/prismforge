name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows checks and native build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p prismforge-desktop --all-targets --features ts -- -D warnings

      - name: Rust tests, including the fixture drift check
        run: cargo test --workspace

      - name: Binding drift check
        run: cargo test -p prismforge-desktop --features ts --test bindings

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/desktop
        run: pnpm typecheck

      - name: Frontend tests
        working-directory: apps/desktop
        run: pnpm test

      - name: Native build (unsigned)
        working-directory: apps/desktop
        run: pnpm tauri:build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prismforge-windows-unsigned
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error

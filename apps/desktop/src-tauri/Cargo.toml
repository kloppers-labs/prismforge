[package]
name = "prismforge-desktop"
version = "0.1.0"
description = "PrismForge desktop shell"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "prismforge_desktop"

[features]
ts = ["dep:ts-rs", "prismforge-core/ts"]

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
prismforge-core.workspace = true
prismforge-openrgb.workspace = true
prismforge-testkit.workspace = true
serde.workspace = true
tauri = { version = "=2.12.6", features = [] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "=1.0.154"
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true

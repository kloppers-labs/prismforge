[package]
name = "prismforge-desktop"
version = "0.1.0"
description = "PrismForge desktop shell"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "prismforge_desktop"

[features]
ts = ["dep:ts-rs", "prismforge-core/ts", "prismforge-effects/ts", "prismforge-system-events/ts"]

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
prismforge-core.workspace = true
prismforge-effects.workspace = true
prismforge-openrgb.workspace = true
prismforge-system-events.workspace = true
prismforge-testkit.workspace = true
serde.workspace = true
tauri = { version = "=2.12.6", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
ts-rs = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-registry = "=0.6.1"

[target.'cfg(not(windows))'.dependencies]
auto-launch = "=0.6.0"

[dev-dependencies]
serde_json = "=1.0.154"
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
